name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Ensure Android platform exists
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --project-name=cineverse \
              --org=com.cineverse \
              --no-pub
          fi

          # The generated Flutter test template references MyApp, while CineVerse has its own app entrypoint.
          rm -f test/widget_test.dart

          # flutter_litert_lm 0.3.0 uses the Kotlin compilerOptions DSL.
          # Kotlin 1.8.x is too old for that API, so keep the generated Android
          # project on a compatible Kotlin/Gradle combination.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")
          build_gradle = next((p for p in [root / "build.gradle", root / "build.gradle.kts"] if p.exists()), root / "build.gradle")
          settings_gradle = next((p for p in [root / "settings.gradle", root / "settings.gradle.kts"] if p.exists()), root / "settings.gradle")
          app_gradle = next((p for p in [root / "app" / "build.gradle", root / "app" / "build.gradle.kts"] if p.exists()), root / "app" / "build.gradle")

          # Kotlin 2.3.21 requires a modern Android Gradle Plugin; use the same toolchain as flutter_litert_lm.
          # Flutter 3.22.2 can generate AGP 7.3.0, so patch the generated
          # Android project and wrapper to a compatible toolchain.
          wrapper_props = root / "gradle" / "wrapper" / "gradle-wrapper.properties"

          kotlin_version = "2.3.21"
          agp_version = "8.11.1"
          gradle_version = "8.13"

          # Flutter 3.22 can generate the Kotlin version in either
          # settings.gradle or the legacy root build.gradle depending on the
          # template. Patch both forms so CI is deterministic.
          if build_gradle.exists():
              text = build_gradle.read_text()
              text = text.replace("com.android.tools.build:gradle:7.3.0", f"com.android.tools.build:gradle:{agp_version}")
              text = text.replace("com.android.tools.build:gradle:7.4.2", f"com.android.tools.build:gradle:{agp_version}")
              build_gradle.write_text(text)

          # New Flutter templates declare AGP in settings.gradle via the plugins DSL.
          if settings_gradle.exists():
              text = settings_gradle.read_text()
              import re
              text = re.sub(r'(id\s*\(?["']com\.android\.application["']\)?\s+version\s+["'])([0-9.]+)(["'])', rf'\g<1>{agp_version}\g<3>', text)
              settings_gradle.write_text(text)

          if wrapper_props.exists():
              text = wrapper_props.read_text()
              import re
              text = re.sub(r"distributionUrl=.*", f"distributionUrl=https\\://services.gradle.org/distributions/gradle-{gradle_version}-all.zip", text)
              wrapper_props.write_text(text)

          for path in (settings_gradle, build_gradle):
              if path.exists():
                  text = path.read_text()
                  import re
                  text = re.sub(r'(org\\.jetbrains\\.kotlin\\.android[^\\n]*?version\\s+")([0-9.]+)(")', rf'\\g<1>{kotlin_version}\\g<3>', text)
                  text = re.sub(r'(kotlin\\s*\\(?"android"\\)?\\s+version\\s+")([0-9.]+)(")', rf'\\g<1>{kotlin_version}\\g<3>', text)
                  text = text.replace('"1.7.10"', f'"{kotlin_version}"')
                  text = text.replace("'1.7.10'", f"'{kotlin_version}'")
                  text = text.replace('"1.8.22"', f'"{kotlin_version}"')
                  text = text.replace("'1.8.22'", f"'{kotlin_version}'")
                  path.write_text(text)

          if app_gradle.exists():
              text = app_gradle.read_text()
              if app_gradle.suffix == ".kts":
                  text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
                  text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
                  text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
                  text = text.replace("ndkVersion = flutter.ndkVersion", 'ndkVersion = "27.0.12077973"')
                  text = text.replace("sourceCompatibility = JavaVersion.VERSION_11", "sourceCompatibility = JavaVersion.VERSION_17")
                  text = text.replace("targetCompatibility = JavaVersion.VERSION_11", "targetCompatibility = JavaVersion.VERSION_17")
                  text = text.replace("jvmTarget = JavaVersion.VERSION_11.toString()", "jvmTarget = JavaVersion.VERSION_17.toString()")
                  if "isCoreLibraryDesugaringEnabled = true" not in text:
                      text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  if "coreLibraryDesugaring(" not in text:
                      text = text.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")", 1)
                  app_gradle.write_text(text)
              else:
                  text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              text = text.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              text = text.replace("ndkVersion flutter.ndkVersion", 'ndkVersion "27.0.12077973"')
              text = text.replace("ndkVersion = flutter.ndkVersion", 'ndkVersion = "27.0.12077973"')
              text = text.replace("details.useVersion \"1.8.22\"", f'details.useVersion "{kotlin_version}"')
              text = text.replace("details.useVersion \"1.7.10\"", f'details.useVersion "{kotlin_version}"')
              if "coreLibraryDesugaringEnabled true" not in text and "isCoreLibraryDesugaringEnabled = true" not in text:
                  marker = "android {"
                  compile_block = """android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""
                  if marker in text:
                      text = text.replace(marker, compile_block, 1)
                  else:
                      raise SystemExit("android/app/build.gradle has no android block")
              if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:" not in text and 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in text:
                  dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", "dependencies {\n    " + dependency, 1)
                  else:
                      text += "\n\ndependencies {\n    " + dependency + "\n}\n"
              if "resolutionStrategy.eachDependency" not in text:
                  block = f"""
          configurations.all {{
              resolutionStrategy.eachDependency {{ details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {{
                      details.useVersion "{kotlin_version}"
                  }}
              }}
          }}
          """
                  text += "\n" + block
              # Explicitly force Java 17, Kotlin 17 and NDK 27 on the generated app module.
              text += """
          android {
              ndkVersion "27.0.12077973"
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
              app_gradle.write_text(text)

          # Fail early if the Android template did not receive the required
          # Kotlin version instead of producing a less useful Gradle error.
          combined = ""
          for path in (settings_gradle, build_gradle, app_gradle):
              if path.exists():
                  combined += path.read_text() + "\n"

          if kotlin_version not in combined:
              raise SystemExit("Kotlin 2.3.21 was not applied to the Android project")
          agp_applied = (
              f"com.android.tools.build:gradle:{agp_version}" in combined
              or f'id "com.android.application" version "{agp_version}"' in combined
              or f"id 'com.android.application' version '{agp_version}'" in combined
          )
          if not agp_applied:
              raise SystemExit(f"AGP {agp_version} was not applied to the Android project")

          print("Android Gradle project prepared with Kotlin", kotlin_version, "and AGP", agp_version)
          PY

          # LiteRT-LM 0.3.0 ships an AAR containing Java 21 bytecode.
          # Jetifier bundled with older Android toolchains cannot transform class
          # file major version 65, and the Flutter/AndroidX project does not need
          # Jetifier for these dependencies. Keep AndroidX enabled and disable
          # Jetifier before resolving plugin dependencies.
          python3 - <<'PY'
          from pathlib import Path

          props = Path("android/gradle.properties")
          existing = props.read_text() if props.exists() else ""
          lines = [line for line in existing.splitlines()
                   if not line.startswith("android.useAndroidX=")
                   and not line.startswith("android.enableJetifier=")]
          lines.extend([
              "android.useAndroidX=true",
              "android.enableJetifier=false",
          ])
          props.write_text("\n".join(lines) + "\n")
          print("AndroidX enabled; Jetifier disabled")
          PY

          echo "===== Android Gradle configuration ====="
          for f in android/settings.gradle android/settings.gradle.kts; do [ -f "$f" ] && sed -n "1,240p" "$f"; done
          for f in android/build.gradle android/build.gradle.kts; do [ -f "$f" ] && sed -n "1,240p" "$f"; done
          for f in android/app/build.gradle android/app/build.gradle.kts; do [ -f "$f" ] && sed -n "1,300p" "$f"; done
          echo "===== Gradle wrapper ====="
          grep -n "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 127
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "ndk;27.0.12077973"
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
            echo "sdkmanager failed with exit code $SDKMANAGER_STATUS" >&2
            exit "$SDKMANAGER_STATUS"
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed | grep -E "platforms;android-36" || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Flutter
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Patch legacy speech_to_text Android build config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob

          matches = glob.glob('/home/runner/.pub-cache/hosted/pub.dev/speech_to_text-7.2.0/android/build.gradle')
          if not matches:
              raise SystemExit('speech_to_text 7.2.0 Android build.gradle was not found')

          path = Path(matches[0])
          text = path.read_text()

          replacements = {
              'compileSdkVersion flutter.compileSdkVersion': 'compileSdkVersion 36',
              'compileSdk = flutter.compileSdkVersion': 'compileSdk = 36',
              'minSdkVersion flutter.minSdkVersion': 'minSdkVersion 24',
              'minSdk = flutter.minSdkVersion': 'minSdk = 24',
              'targetSdkVersion flutter.targetSdkVersion': 'targetSdkVersion 36',
              'targetSdk = flutter.targetSdkVersion': 'targetSdk = 36',
              'ndkVersion = flutter.ndkVersion': '',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)

          remaining = [token for token in replacements if token in text]
          if remaining:
              raise SystemExit('Unpatched speech_to_text Flutter Gradle references: ' + ', '.join(remaining))

          print('Patched', path)
          PY

      - name: Align LiteRT-LM Android Gradle toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob

          kotlin_version = "2.3.21"
          agp_version = "8.11.1"
          matches = glob.glob('/home/runner/.pub-cache/hosted/pub.dev/flutter_litert_lm-0.3.0/android/build.gradle.kts')
          if not matches:
              raise SystemExit('flutter_litert_lm 0.3.0 Android build.gradle.kts was not found')

          path = Path(matches[0])
          text = path.read_text()
          text = text.replace('val kotlinVersion = "2.2.20"', f'val kotlinVersion = "{kotlin_version}"')
          text = text.replace('classpath("com.android.tools.build:gradle:8.11.1")', f'classpath("com.android.tools.build:gradle:{agp_version}")')
          path.write_text(text)

          verify = path.read_text()
          if kotlin_version not in verify or agp_version not in verify:
              raise SystemExit('LiteRT-LM Gradle toolchain was not patched correctly')
          print('Patched', path, 'to Kotlin', kotlin_version, 'and AGP', agp_version)
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Verify APK exists
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
