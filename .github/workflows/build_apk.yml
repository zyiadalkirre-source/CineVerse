name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Ensure Android platform exists
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --project-name=cineverse \
              --org=com.cineverse \
              --no-pub
          fi

          # The generated Flutter test template references MyApp, while CineVerse has its own app entrypoint.
          rm -f test/widget_test.dart

          # flutter_litert_lm 0.3.0 uses the Kotlin compilerOptions DSL.
          # Kotlin 1.8.x is too old for that API, so keep the generated Android
          # project on a compatible Kotlin/Gradle combination.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")
          build_gradle = root / "build.gradle"
          settings_gradle = root / "settings.gradle"
          app_gradle = root / "app" / "build.gradle"

          kotlin_version = "2.3.21"

          # Flutter 3.22 can generate the Kotlin version in either
          # settings.gradle or the legacy root build.gradle depending on the
          # template. Patch both forms so CI is deterministic.
          for path in (settings_gradle, build_gradle):
              if path.exists():
                  text = path.read_text()
                  text = text.replace('"1.7.10"', f'"{kotlin_version}"')
                  text = text.replace("'1.7.10'", f"'{kotlin_version}'")
                  text = text.replace('"1.8.22"', f'"{kotlin_version}"')
                  text = text.replace("'1.8.22'", f"'{kotlin_version}'")
                  path.write_text(text)

          if app_gradle.exists():
              text = app_gradle.read_text()
              text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              text = text.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              text = text.replace("details.useVersion \"1.8.22\"", f'details.useVersion "{kotlin_version}"')
              text = text.replace("details.useVersion \"1.7.10\"", f'details.useVersion "{kotlin_version}"')
              if "resolutionStrategy.eachDependency" not in text:
                  block = f"""
          configurations.all {{
              resolutionStrategy.eachDependency {{ details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {{
                      details.useVersion "{kotlin_version}"
                  }}
              }}
          }}
          """
                  text += "\n" + block
              app_gradle.write_text(text)

          # Fail early if the Android template did not receive the required
          # Kotlin version instead of producing a less useful Gradle error.
          combined = ""
          for path in (settings_gradle, build_gradle, app_gradle):
              if path.exists():
                  combined += path.read_text() + "\n"

          if kotlin_version not in combined:
              raise SystemExit("Kotlin 2.3.21 was not applied to the Android project")

          print("Android Gradle project prepared with Kotlin", kotlin_version)
          PY

          # LiteRT-LM 0.3.0 ships an AAR containing Java 21 bytecode.
          # Jetifier bundled with older Android toolchains cannot transform class
          # file major version 65, and the Flutter/AndroidX project does not need
          # Jetifier for these dependencies. Keep AndroidX enabled and disable
          # Jetifier before resolving plugin dependencies.
          python3 - <<'PY'
          from pathlib import Path

          props = Path("android/gradle.properties")
          existing = props.read_text() if props.exists() else ""
          lines = [line for line in existing.splitlines()
                   if not line.startswith("android.useAndroidX=")
                   and not line.startswith("android.enableJetifier=")]
          lines.extend([
              "android.useAndroidX=true",
              "android.enableJetifier=false",
          ])
          props.write_text("\n".join(lines) + "\n")
          print("AndroidX enabled; Jetifier disabled")
          PY

          echo "===== Android Gradle configuration ====="
          sed -n '1,240p' android/settings.gradle
          sed -n '1,240p' android/build.gradle
          sed -n '1,300p' android/app/build.gradle
          echo "===== Gradle wrapper ====="
          grep -n "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 127
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36"
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
            echo "sdkmanager failed with exit code $SDKMANAGER_STATUS" >&2
            exit "$SDKMANAGER_STATUS"
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed | grep -E "platforms;android-36" || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Flutter
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Patch legacy speech_to_text Android build config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob

          matches = glob.glob('/home/runner/.pub-cache/hosted/pub.dev/speech_to_text-7.2.0/android/build.gradle')
          if not matches:
              raise SystemExit('speech_to_text 7.2.0 Android build.gradle was not found')

          path = Path(matches[0])
          text = path.read_text()

          replacements = {
              'compileSdkVersion flutter.compileSdkVersion': 'compileSdkVersion 36',
              'compileSdk = flutter.compileSdkVersion': 'compileSdk = 36',
              'minSdkVersion flutter.minSdkVersion': 'minSdkVersion 24',
              'minSdk = flutter.minSdkVersion': 'minSdk = 24',
              'targetSdkVersion flutter.targetSdkVersion': 'targetSdkVersion 36',
              'targetSdk = flutter.targetSdkVersion': 'targetSdk = 36',
              'ndkVersion = flutter.ndkVersion': '',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)

          remaining = [token for token in replacements if token in text]
          if remaining:
              raise SystemExit('Unpatched speech_to_text Flutter Gradle references: ' + ', '.join(remaining))

          print('Patched', path)
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Verify APK exists
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
