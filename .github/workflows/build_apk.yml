name: Build Android APK

on:
  push:
    branches:
      - main
      - feat/cloud-sync-service
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Patch flutter_inappwebview for AGP 9
        shell: bash
        run: |
          set -euo pipefail

          package_gradle="$(find "$PUB_CACHE/hosted/pub.dev" -path '*/flutter_inappwebview_android-*/android/build.gradle' -print -quit)"
          if [ -z "$package_gradle" ]; then
            echo "flutter_inappwebview_android Android Gradle file was not found."
            exit 1
          fi

          if grep -q "getDefaultProguardFile('proguard-android.txt')" "$package_gradle"; then
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$package_gradle"
            echo "Patched flutter_inappwebview_android for AGP 9 compatibility."
          else
            echo "No legacy proguard-android.txt reference found; leaving dependency unchanged."
          fi

      - name: Inject google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail

          mkdir -p android/app

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json 2>/dev/null               && python3 -m json.tool android/app/google-services.json >/dev/null 2>&1; then
              echo "google-services.json injected from GOOGLE_SERVICES_JSON (base64)."
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
              python3 -m json.tool android/app/google-services.json >/dev/null
              echo "google-services.json injected from GOOGLE_SERVICES_JSON (raw JSON)."
            fi
          elif [ -n "${FIREBASE_ANDROID_CONFIG_JSON:-}" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
            python3 -m json.tool android/app/google-services.json >/dev/null
            echo "google-services.json injected from legacy FIREBASE_ANDROID_CONFIG_JSON."
          else
            echo "GOOGLE_SERVICES_JSON is not configured; Firebase Android file injection skipped."
          fi

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/app/google-services.json ]; then
            echo "No google-services.json found; Google Services plugin will not be applied."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Kotlin DSL Android scaffold files are missing")

          text = settings.read_text()
          plugin_line = '    id("com.google.gms.google-services") version "4.4.4" apply false'
          if plugin_line not in text:
              marker = 'plugins {'
              if marker not in text:
                  raise SystemExit("Unable to locate plugins block in android/settings.gradle.kts")
              text = text.replace(marker, marker + "\n" + plugin_line, 1)
              settings.write_text(text)

          text = app.read_text()
          app_plugin = '    id("com.google.gms.google-services")'
          if app_plugin not in text:
              marker = '    id("dev.flutter.flutter-gradle-plugin")'
              if marker not in text:
                  raise SystemExit("Unable to locate Flutter Gradle plugin in android/app/build.gradle.kts")
              text = text.replace(marker, marker + "\n" + app_plugin, 1)
              app.write_text(text)

          print("Google Services Gradle plugin configured.")
          PY

      - name: Verify Firebase Android configuration
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ ! -f android/app/google-services.json ]; then
            echo "google-services.json is missing for the Android build."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("android/app/google-services.json")
          data = json.loads(path.read_text())

          project = data.get("project_info", {})
          clients = data.get("client", [])

          if not project.get("project_id"):
              raise SystemExit("Firebase project_id is missing from google-services.json")
          if not clients:
              raise SystemExit("No Android client exists in google-services.json")

          android_packages = []
          oauth_client_types = []

          for client in clients:
              android = client.get("client_info", {}).get("android_client_info", {})
              package_name = android.get("package_name")
              if package_name:
                  android_packages.append(package_name)

              for entry in client.get("oauth_client", []):
                  oauth_client_types.append(str(entry.get("client_type")))

          if not android_packages:
              raise SystemExit("No Android package configuration exists in google-services.json")

          app_gradle = Path("android/app/build.gradle.kts")
          gradle_text = app_gradle.read_text()
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', gradle_text)
          application_id = match.group(1) if match else None

          if application_id and application_id not in android_packages:
              raise SystemExit(
                  "google-services.json does not contain the Android applicationId "
                  + application_id
                  + ". Add that exact Android package to Firebase and download a new google-services.json."
              )

          has_web_oauth_client = "3" in oauth_client_types
          explicit_web_client_id = os.environ.get("GOOGLE_WEB_CLIENT_ID", "").strip()

          if explicit_web_client_id and not explicit_web_client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("GOOGLE_WEB_CLIENT_ID does not look like a Google OAuth client ID")

          print("Firebase Android configuration is structurally valid.")
          print("Configured Android package(s):", ", ".join(android_packages))
          print("OAuth client types:", ", ".join(sorted(set(oauth_client_types))) if oauth_client_types else "none")

          if has_web_oauth_client:
              print("Web OAuth client: present in google-services.json")
          elif explicit_web_client_id:
              print("Web OAuth client: provided by GOOGLE_WEB_CLIENT_ID secret")
          else:
              print("WARNING: Web OAuth client is not configured yet. Build will continue so the APK signing SHA-1/SHA-256 can be extracted.")
              print("After adding the SHA fingerprints in Firebase, download a fresh google-services.json (or set GOOGLE_WEB_CLIENT_ID).")
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release             --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}"             --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"             --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"             --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}"             --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"             --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"             --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"             --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"             --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"             --dart-define=VIDEO_SOURCE_BASE_URL="${{ secrets.VIDEO_SOURCE_BASE_URL }}"

      - name: Verify APK exists
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Show APK signing certificate SHA-1
        shell: bash
        run: |
          set -euo pipefail
          echo "===== APK signing certificate ====="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | sed -n '/Owner:/p;/Issuer:/p;/SHA1:/p;/SHA-256:/p'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
