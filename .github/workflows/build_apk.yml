name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Ensure Android platform exists
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --project-name=cineverse \
              --org=com.cineverse \
              --no-pub
          fi

          # The generated Flutter test template references MyApp, while CineVerse has its own app entrypoint.
          rm -f test/widget_test.dart

          # Align Kotlin versions in the generated Android project.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")
          build_gradle = root / "build.gradle"
          app_gradle = root / "app" / "build.gradle"

          if build_gradle.exists():
              text = build_gradle.read_text()
              text = text.replace("ext.kotlin_version = '1.7.10'", "ext.kotlin_version = '1.8.22'")
              text = text.replace('ext.kotlin_version = "1.7.10"', 'ext.kotlin_version = "1.8.22"')
              build_gradle.write_text(text)

          if app_gradle.exists():
              text = app_gradle.read_text()
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              block = """
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion "1.8.22"
                  }
              }
          }
          """
              if "resolutionStrategy.eachDependency" not in text:
                  text += "\n" + block
              app_gradle.write_text(text)
          PY

          echo "===== Android Gradle configuration ====="
          sed -n '1,220p' android/build.gradle
          sed -n '1,260p' android/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Flutter
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release \
            --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Verify APK exists
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
